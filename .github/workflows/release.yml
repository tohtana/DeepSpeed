name: Build and publish DeepSpeed release
run-name: Release ${{ inputs.target_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full SHA on master (blank uses the dispatch commit)
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: deepspeed-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify release target
    if: github.repository == 'deepspeedai/DeepSpeed' && (github.event_name != 'push' || github.event.created)
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.target.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve commit and version
      id: target
      env:
        REQUESTED_SHA: ${{ inputs.target_sha }}
      run: bash release/github_release.sh resolve

  deploy:
    needs: resolve
    runs-on: ubuntu-24.04
    environment: release-env
    permissions:
      contents: write
    env:
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Build source distribution
      run: bash release/github_release.sh build
    - name: Create tag and GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash release/github_release.sh release
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        repository-url: https://upload.pypi.org/legacy/
    - name: Open version bump pull request
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: bash release/github_release.sh bump
